format:
  html:
    theme:
      - flatly
      - custom.scss
    toc: true
    include-in-header:
      text: |
        <script>
          // 마우스 우클릭 방지 (단, 이메일 링크는 기본 동작 허용)
          document.addEventListener('contextmenu', function(e) {
            if (!e.target.closest('a[href^="mailto:"]')) {
              e.preventDefault();
            }
          });
          
          // 이미지 드래그 방지
          document.addEventListener('dragstart', function(e) {
            if (e.target.tagName === 'IMG') {
              e.preventDefault();
            }
          });
        </script>